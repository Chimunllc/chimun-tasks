# sw.js-ийн CACHE_VERSION-ыг main дээр АВТОМАТААР бөглөнө.
#
# Яагаад: хувилбарыг гараар засдаг байсан тул зэрэгцээ ажилладаг салбар бүр
# ЯГ ТЭР МӨРИЙГ өөрчилж, merge бүрд конфликт үүсгэдэг байв (2026-09-04-нд нэг
# PR дээр 4 удаа: v829→v835). Одоо салбарууд sw.js-д ХҮРЭХГҮЙ.
#
# Урсгал: PR merge → энэ workflow → шалгалт гүйнэ → «lint» статус бичигдэнэ →
#         хувилбар main руу орно → Pages дахин байрлуулна → утсанд код хүрнэ.
#
# ⚠ Яагаад шалгалтыг энд өөрөө ажиллуулж, статусыг гараар бичдэг вэ:
# main дээр «lint» шалгалт ЗААВАЛ байх ёстой (branch protection). Ботын
# нэмэгдүүлсэн коммит дээр lint.yml өөрөө АСДАГГҮЙ — GITHUB_TOKEN-оор хийсэн
# push/PR нь шинэ workflow үүсгэхгүй (GitHub-ийн хязгааргүй давталтын
# хамгаалалт). Тиймээс шалгалт хоосон үлдэж push татгалзана (GH006 —
# 2026-09-04-нд эхний ажиллалт яг ингэж унаж, ажилчдад код хүрээгүй).
#
# Шийдэл: шалгалтыг (lint.yml-тэй ижил) ҮНЭХЭЭР ажиллуулаад, амжилттай бол
# коммитын SHA дээр «lint» статус бичнэ. Шалгалт унавал статус бичигдэхгүй тул
# худал батламж гарахгүй — хамгаалалт хүчээ хадгална.
#
# ⚠ PR-аар оруулах замыг оролдож үзсэн боловч repo-гийн тохиргоо хаадаг:
# «GitHub Actions is not permitted to create or approve pull requests».
# Settings → Actions → General дээр тэрийг нээвэл PR-аар оруулах болгож болно.

name: Кэшийн хувилбар

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.json'
      - 'icon.svg'

# Хоёр merge ойрхон болвол push-ууд мөргөлдөхөөс сэргийлж дараалуулна.
concurrency:
  group: cache-version-main
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  bump:
    # Өөрийнхөө commit-оос дахин асахаас сэргийлнэ (хязгааргүй давталт).
    if: "!contains(github.event.head_commit.message, '[cache-bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1-тэй харьцуулна

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Хувилбар нэмэгдүүлэх
        id: bump
        run: |
          set -euo pipefail
          # PR гарчгаас богино шошго гаргана (ж: «Гэрээний байршил…» → merge-нэрээс)
          LABEL=$(echo "${{ github.event.head_commit.message }}" | head -1 \
                  | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-24)
          [ -n "$LABEL" ] || LABEL=auto
          NEW=$(node .github/scripts/bump-cache-version.mjs "$LABEL") || exit 1
          if [ -z "$NEW" ]; then
            echo "Кэшлэгддэг файл өөрчлөгдөөгүй — алгаслаа"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=$NEW" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ⚠ lint.yml-ийн шалгалттай ЯГ ижил байх ёстой — тэрийг өөрчилвөл энийг ч
      # өөрчил. Энд ажиллуулсны дараа л «lint» статус бичигдэнэ (худал батламж
      # өгөхгүй: шалгалт үнэхээр гүйсэн байж л статус гарна).
      - name: Шалгалт (lint.yml-тэй ижил)
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          npx --yes eslint@8 \
            --no-eslintrc \
            --rule '{"no-undef":"error","no-unused-vars":"off","no-redeclare":"warn"}' \
            --env browser --env serviceworker --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            --global ICONS:readonly --global BRANCHES:readonly \
            --global TEAM:writable --global state:writable \
            app.js
          npx --yes eslint@8 \
            --no-eslintrc --rule '{"no-undef":"error"}' \
            --env serviceworker --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            sw.js
          node test/run.js

      - name: main руу бичих
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          TMP="refs/heads/cache-bump/${{ github.run_id }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git commit -m "sw: $NEW [cache-bump]"

          # Статус бичихийн тулд коммит сервер дээр БАЙХ ёстой — түр салбар руу
          # түлхээд, статус бичээд, дараа нь main руу оруулж, түр салбарыг устгана.
          git push origin "HEAD:$TMP"
          SHA=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=lint \
            -f description='syntax + eslint + тест (cache-bump)' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; break; fi
            # main зэрэг урагшилсан бол rebase хийнэ — шинэ SHA-д статус дахин бичнэ
            git pull --rebase origin main
            SHA=$(git rev-parse HEAD)
            git push -f origin "HEAD:$TMP"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success -f context=lint \
              -f description='syntax + eslint + тест (cache-bump)' >/dev/null
          done
          git push origin --delete "$TMP" || true
          [ "$ok" = 1 ] || { echo "::error::CACHE_VERSION-ыг main руу бичиж чадсангүй. Ажилчдын утсанд ШИНЭ КОД ХҮРЭХГҮЙ — sw.js-ийн хувилбарыг гараар нэмэгдүүлнэ үү."; exit 1; }
