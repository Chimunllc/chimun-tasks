# ШӨНИЙН АГЕНТ — өдөрт нэг удаа, ХОЁР ЗАМ ЗЭРЭГ.
#
# ⛔ ЭРЭМБЭ БАЙХГҮЙ (2026-09-24). Өмнө нь «алдаа байвал зөвхөн түүнийг зас»
# байсан тул ЗАСАГДАХГҮЙ нэг алдаа бүх автоматыг зогсоодог байв: 09-21-ээс
# 09-24 хүртэл 4 шөнө дараалан #565 (Facebook-ийн in-app браузер) дээр гацаж,
# дизайны өр ч хийгдээгүй. Одоо `lane` матрицаар хоёр зам ЗЭРЭГ явна —
# нэг зам гацсан нь нөгөөг зогсоохгүй. Тус тусдаа PR, тус тусдаа шалгуур.
#   · `error` — ажилтны утсан дээр гарсан алдаа (хаалт: тестийн тоо ӨСӨХ)
#   · `debt`  — дизайны өр (хаалт: өрийн тоо БУУРАХ)
#
# ⛔ АЛДАА ЗАСАХ ГОРИМЫН ЦОРЫН ГАНЦ ХААЛТ = ТЕСТИЙН ТОО ӨСӨХ. Нөхөн
# үзүүлэх тест бичээгүй бол агент алдааг ойлгоогүй буюу таамагласан —
# тэр үед PR нээгдэхгүй, Issue хүнд үлдэнэ. «Засах боломжгүй» гэж дуусах
# нь ЗӨВ хариу (гадны код, сүлжээ) — workflow улаан болохгүй.
#
# УБ 02:00-д ажиллана. Хэмжигч (tools/debt-check.js) хамгийн их inline style
# хуримтлагдсан функцийг нэрлэж өгнө → агент ТЭР НЭГИЙГ л зас → PR → CI ногоон
# → автоматаар merge. Буцаах харуул (revert-watch.yml) эвдрэлийг сэргээнэ.
#
# Яагаад «алдаа зас» биш «өр бууруул» вэ: 2026-09-16-нд нээлттэй 10 алдааны
# Issue-ний бараг бүгд нь кодын алдаа БИШ (апп дахин эхлэх, сүлжээ, Android
# WebView). Агент тэднийг таамаглаж «зассаар» байвал токен үрнэ. Дизайны өр нь
# ТООГООР хэмжигддэг, тестээр батлагддаг — автомат гогцоо үүнийг үнэхээр барина.
#
# ХАМГААЛАЛТЫН БҮРХҮҮЛ (бүгд МЕХАНИК, prompt-д найдаагүй):
#   ① бүх тест + ESLint + syntax (lint.yml)
#   ② дизайны өрийн храповик — өр өсвөл PR унана
#   ③ агент workflow/эрхийн файлд хүрвэл PR унана (lint.yml)
#   ④ merge хийхээс өмнө: өр ҮНЭХЭЭР буурсан байх + diff хэмжээний дээд хязгаар
#   ⑤ merge-ийн дараа: буцаах харуул 20 мин тутам алдаа хардаг
#
# 📋 ӨГЛӨӨ ХААНААС ХАРАХ: «🌙 Шөнийн агентын түүх» Issue (шошго `шөнийн-агент`).
#    Шөнө бүр нэг мөр — амжилттай ч, УНАСАН ч бичигдэнэ.
# 🔌 Автомат merge унтраах: доорх AUTO_MERGE-ийг 'false' болго (PR нээлттэй үлдэнэ).
# ⚠ Түлхүүр (CLAUDE_CODE_OAUTH_TOKEN эсвэл ANTHROPIC_API_KEY) байхгүй бол
#   чимээгүй өнгөрнө (улаан болохгүй) — тэр үед хураангуй ч бичигдэхгүй.
# ⛔ `NIGHT_PAT` (хувийн токен, Contents+Pull requests: RW) ЗААВАЛ. GITHUB_TOKEN-оор
#   нээсэн PR дээр GitHub нь шалгалтыг `action_required` гэж түгжиж ХЭЗЭЭ Ч
#   ажиллуулдаггүй → required `lint` ногоон болохгүй → авто merge мөнхөд гацна
#   (2026-09-17-нд #450 яг ингэж гацаж, хураангуйд «CI улаан» гэж ХУДАЛ бичигдсэн).
#   Түлхүүр байхгүй бол агент ажиллана, PR нээнэ, гэхдээ «CI ажиллаагүй» гэж
#   ил хэлээд merge хийхгүй.
name: Шөнийн агент

on:
  schedule:
    - cron: '0 18 * * *'      # UTC 18:00 = УБ 02:00
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'CI ногоон бол автоматаар merge хийх'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write             # өглөөний хураангуйг Issue-д бичнэ

concurrency:
  group: agent-night
  cancel-in-progress: false

env:
  AUTO_MERGE: 'true'          # cron үед автоматаар merge хийх эсэх
  MAX_DIFF_LINES: '500'       # үүнээс том diff-ийг автоматаар merge хийхгүй

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ⛔ `fail-fast: false` — нэг зам унахад нөгөөг БҮҮ цуцал. Тэр нь яг
    #    л бидний зассан гацаа (нэг зам бүгдийг зогсоох) руу буцах зам.
    strategy:
      fail-fast: false
      matrix:
        lane: [error, debt]
    steps:
      - name: Түлхүүр шалгах
        id: key
        env:
          # Хоёр зам: ① CLAUDE_CODE_OAUTH_TOKEN (Pro/Max бишрэл, `claude setup-token`)
          #           ② ANTHROPIC_API_KEY (console.anthropic.com, тусдаа төлбөр)
          # Аль нэг байхад хангалттай. Хоёулаа байвал action нь OAuth-ыг эрхэмлэнэ.
          HAS_KEY: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Түлхүүр нэмэгдээгүй — шөнийн агент унтраалттай. Settings → Secrets and variables → Actions → CLAUDE_CODE_OAUTH_TOKEN эсвэл ANTHROPIC_API_KEY."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Өнөөдрийн ажлыг сонгох
        id: task
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          # ─── ЭНЭ ЗАМ ЮУ ХИЙХ ВЭ ───
          # Зам нь матрицаар тогтоогддог: `error` эсвэл `debt`. Хийх ажил
          # байхгүй бол ТЭР ЗАМ л алгасна (нөгөө зам хэвийн явна).
          if [ "$LANE" != "error" ]; then
            echo "mode=debt" >> "$GITHUB_OUTPUT"
          else
          # Шошго байхгүй бол `--add-label` унадаг тул заавал үүсгэнэ.
          gh label create "засагдахгүй" --color ededed \
            --description "Шөнийн агент засаж чадаагүй — сонголтоос хасагдана" 2>/dev/null || true
          gh label create "сайт" --color 1d76db \
            --description "mevent.mn сайтын алдаа — ӨӨР репод засагдана" 2>/dev/null || true

          # ⛔ ХАМГИЙН ХУУЧНААС (өмнө хамгийн ШИНЭЭС авдаг байсан тул шинэ
          #    засагдахгүй алдаа гарах бүрд жижүүр дахин тэр дээрээ гацдаг байв).
          # Хоёр төрөл сонголтоос хасагдана:
          #  · `засагдахгүй` — агент өмнө нь оролдож чадаагүй. Хүн шошгыг авбал
          #    дахин эргэлтэд орно (хаалт хүнд, механикад биш).
          #  · `сайт` — mevent.mn нь ӨӨР РЕПО (CLAUDE.md). Энд засах код БАЙХГҮЙ
          #    тул агент шөнө бүр «боломжгүй» гэж дуусах л болно.
          CANDS=$(gh issue list --state open --limit 20 --json number --jq '.[].number' \
                    --search 'label:"алдаа" -label:"засагдахгүй" -label:"сайт" sort:created-asc' \
                    2>/dev/null || true)
          ISSUE=''
          for N in $CANDS; do
            BODY=$(gh issue view "$N" --json body --jq .body 2>/dev/null || true)
            # Сайтын алдааг ӨӨРӨӨ таньж шошголно — дараагийн шөнө дахин уншихгүй.
            # Таних тэмдэг нь triage-ийн бичдэг «хувилбар: site» / «Дэлгэц: mevent.mn».
            if printf '%s' "$BODY" | grep -qE 'хувилбар:\*\* `site`|Дэлгэц:\*\* `mevent\.mn`'; then
              echo "#$N нь сайтын алдаа — хасав."
              gh issue edit "$N" --add-label "сайт" >/dev/null 2>&1 || true
              gh issue comment "$N" --body "🌙 Энэ нь **mevent.mn сайтын** алдаа — сайт нь \`Chimunllc/m-event-website-ready\` репод, энэ репод засах код байхгүй. Шөнийн агентын сонголтоос хасав (\`сайт\` шошго)." >/dev/null 2>&1 || true
              continue
            fi
            ISSUE="$N"
            break
          done
          if [ -z "$ISSUE" ]; then
            echo "::notice::Засах алдаа алга — алдааны зам өнөө шөнө ажиллахгүй."
            echo "mode=error" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
            echo "mode=error" >> "$GITHUB_OUTPUT"
            echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "target=алдаа #$ISSUE" >> "$GITHUB_OUTPUT"
            echo "Өнөө шөнө: алдаа #$ISSUE"
            # Тестийн тоог ХАДГАЛНА — «нөхөн үзүүлэх тест бич» дүрмийг МЕХАНИКААР
            # шалгах цорын ганц арга (доорх merge алхмыг үз).
            node test/run.js 2>/dev/null | grep -o 'нийт [0-9]*' | tail -1 \
              | grep -o '[0-9]*' > /tmp/tests-before.txt || echo 0 > /tmp/tests-before.txt
            cat /tmp/tests-before.txt
            # ⛔ ЭНЭ МӨРИЙГ БҮҮ ХАС — доорх PR алхам /tmp/debt-before.json-г
            #    уншдаг. Алдаа засах горимд үүсгэхгүй бол агент алдааг зассан
            #    ч PR нээх алхам ENOENT-ээр УНАНА (2026-09-21-нд #545 дээр
            #    яг ингэж унаж, «шөнийн агент унасан» гэж худал бүртгэгдсэн).
            node tools/debt-check.js --json > /tmp/debt-before.json || echo '{}' > /tmp/debt-before.json
            exit 0
          fi
          node tools/debt-check.js || true
          echo '--- санал ---'
          node tools/debt-check.js --suggest
          # ⚠ Нэрийг гаралтын мөрөөс sed/awk-аар БҮҮ ав — `--suggest-json` нь
          # тогтсон гэрээ. Формат өөрчлөгдөхөд эвдэрхгүй.
          # ⚠ Нэр дангаараа хүрэлцэхгүй: churn эрэмбэ нь `v`, `row` гэх мэт
          # 1-2 үсэгтэй дотоод функцүүдийг дээш гаргадаг тул МӨРИЙН ДУГААР
          # заавал агентад хүрнэ — эс бөгөөс буруу газар зална.
          JSON=$(node tools/debt-check.js --suggest-json)
          if [ -z "$JSON" ]; then
            echo "::notice::Хүрээнд ажил байхгүй — өнөө шөнө агент ажиллахгүй."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARGET=$(echo "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).fn))')
          LINE=$(echo "$JSON"   | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).line))')
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          echo "Өнөөдрийн бай: $TARGET (app.js:$LINE)"
          # Өмнөх тоог ХАДГАЛНА — PR-ын бичвэрийг агентын үгээр биш, бодит
          # зөрүүгээр бичнэ (модель өөрийгөө магтаж болно, тоо магтдаггүй).
          node tools/debt-check.js --json > /tmp/debt-before.json

      # ─────── АЛДАА ЗАСАХ (өр бууруулахаас ӨМНӨ) ───────
      # ⛔ ЦОРЫН ГАНЦ МЕХАНИК ХААЛТ = ТЕСТИЙН ТОО ӨСӨХ. Агент нөхөн үзүүлэх тест
      #    бичиж чадаагүй бол алдааг ОЙЛГООГҮЙ гэсэн үг — тэр үед PR нээгдэхгүй,
      #    Issue хүнд үлдэнэ. Prompt-д «тест бич» гэж бичих нь хангалтгүй
      #    (модель мартдаг, алгасдаг) — тоогоор шалгана.
      - name: Claude — нэг алдааг засах
        if: steps.key.outputs.skip != 'true' && steps.task.outputs.skip != 'true' && steps.task.outputs.mode == 'error'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          branch_prefix: 'claude/night-'
          claude_args: |
            --max-turns 70
            --model claude-opus-5
            --allowedTools Read,Edit,Write,Glob,Grep,Bash
          prompt: |
            Эхлээд `CLAUDE.md`-г бүтнээр унш — бүх дүрэм тэнд.

            ӨНӨӨДРИЙН ЦОРЫН ГАНЦ АЖИЛ: GitHub Issue **#${{ steps.task.outputs.issue }}**
            (`[алдаа]` шошготой) дээрх алдааг зас.

            `gh issue view ${{ steps.task.outputs.issue }}` — мессеж, `src`, `stack`,
            дэлгэц, давтамж, `<!-- fp:… -->` код тэнд бий.

            ДАРААЛАЛ (заавал энэ дарааллаар):
            1. Алдаа ЯГ ХААНА гарч байгааг эх кодоос ол. `src`/`stack` нь замыг заана.
            2. **ЭХЛЭЭД нөхөн үзүүлэх тест бич** `test/run.js`-д — тэр тест
               одоогийн код дээр УНАХ ёстой. `node test/run.js`-ээр унаж байгааг
               ӨӨРИЙН НҮДЭЭР бат. Унахгүй бол алдааг ойлгоогүй байна — дахин үз.
            3. Дараа нь зас. `node test/run.js` — БҮГД ногоон болно.
            4. Тестийн ТОО өссөн байх ёстой (шинэ тест нэмсэн тул).

            ⛔ ЗАСАХ АРГАГҮЙ бол ЮУ Ч БҮҮ ЗАС. Гадны код (өргөтгөл, in-app браузер),
               сүлжээний тасалдал, утас аппыг санах ойноос устгасан — эдгээрт манай
               талд засах зүйл БАЙХГҮЙ. Тэр үед файл бүү хөндөж, ямар ч засвар
               хийхгүйгээр дуус: workflow өөрөө «засаагүй» гэж бичнэ, Issue хүнд үлдэнэ.
               ⚠ Ойлгомжгүй алдааг ТААМАГЛАЖ бүү зас — буруу засвар нь алдаанаас дор.

            ⛔ GIT-Д БҮҮ ХҮР. Салбар, commit, push, PR — бүгдийг workflow хийнэ.

            ХОРИГ (механикаар шалгагдана, зөрчвөл PR унана):
            - Тест устгах / алгасах / сулруулахыг ХОРИГЛОНО.
            - Шинэ `!important`, шинэ inline `style=`, хатуу өнгө/px бичихгүй.
            - `.github/workflows/**`, `db/rls.sql`, `db/anon-grants.sql`-д ХҮРЭХГҮЙ.
            - 500 мөрөөс том diff гаргахгүй.
            - Мөнгө/эрх/DB-ийн логикийг тэр алдаанд ХАМААРАХГҮЙ бол хөндөхгүй.

            Төгсгөлд нэг догол мөрөөр: алдаа юунаас болсон, юуг зассан, ямар тест
            нэмсэн. Засаагүй бол ЯАГААД гэдгийг тодорхой бич.

      - name: Claude — нэг функцийн inline style-ыг класс болгох
        if: steps.key.outputs.skip != 'true' && steps.task.outputs.skip != 'true' && steps.task.outputs.mode == 'debt'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          branch_prefix: 'claude/night-'
          # ⛔ `--allowedTools`-гүй бол агент ФАЙЛ ЗАСАХ, git/gh АЖИЛЛУУЛАХ эрхгүй.
          # 2026-09-16-нд эхний бүтэн ажиллалт 30 эргэлт, $3.63 үрээд
          # `permission_denials_count: 22` гэж дуусаж, салбар ч, PR ч үүсээгүй —
          # атлаа workflow «амжилттай» гэж харагдсан. Хэрэгсэл нээхээ мартвал
          # агент чимээгүй хоосон ажиллана.
          # ⚠ Хэрэгслийн жагсаалт нь ХАМГААЛАЛТ БИШ. Бодит хил нь механик
          # шалгуурууд: храповикууд · diff ≤500 мөр · өр үнэхээр буурсан эсэх ·
          # branch protection. Тиймээс энд өгөөмөр, тэнд хатуу.
          claude_args: |
            --max-turns 70
            --model claude-opus-5
            --allowedTools Read,Edit,Write,Glob,Grep,Bash
          prompt: |
            Эхлээд `CLAUDE.md`-г бүтнээр унш — дизайны гэрээ болон бүх дүрэм тэнд.

            ӨНӨӨДРИЙН ЦОРЫН ГАНЦ АЖИЛ: `${{ steps.task.outputs.target }}` функцийн
            inline `style="..."` -уудыг `styles.css`-ийн класс болгож хөрвүүл.

            **Эхлэх цэг: `app.js`, ${{ steps.task.outputs.line }}-р мөр** — энэ бол
            тэр функцийн АНХНЫ зөрчсөн мөр (функц өөрөө үүнээс дээр эхэлж болно).

            ⚠ Функцийг НЭРЭЭР бүү хай — нэр нь `v`, `row`, `fname` гэх мэт богино
            байж олон таарц гарна. Мөрийн дугаараар ор, дээш уншиж функцийн
            зааг хаана байгааг тогтоо, дараа нь түүний БҮХ inline style-ыг хий.

            ДАРААЛАЛ:
            1. `node tools/debt-check.js --suggest` ажиллуулж байг хараарай.
            2. Тэр мөрөөс функцийг унш. Inline style-уудыг уншиж, ДАВТАГДАЖ
               байгаа хэв маягийг класс болго (нэг style = нэг класс гэж бүү бод).
            3. Шинэ класс бүрийг `styles.css`-д нэм. Өнгө/зай/фонтыг ЗӨВХӨН
               токеноор (`var(--text)`, `var(--space-3)`, `var(--fs-md)`).
               Токен байхгүй бол `:root`-д нэм.
            4. `node test/run.js` — БҮХ тест ногоон байх ёстой (тоог энд бичихгүй,
               өдөр бүр өсдөг — унасан тест 0 байвал зөв).
            5. `node tools/debt-check.js` — өр БУУРСАН байх ёстой.
            6. `node tools/debt-check.js --update` — baseline-ыг чангарууул.
               (Храповик: baseline зөвхөн БУУРАХ тал руу эргэнэ.)

            ⛔ GIT-Д БҮҮ ХҮР. Салбар үүсгэхгүй, commit хийхгүй, push хийхгүй,
               PR нээхгүй. Файлаа зассан чигээр нь ҮЛДЭЭ — workflow өөрөө
               commit, push, PR хийнэ. (2026-09-16: агент 63 эргэлт ажиллаад
               засвараа хийсэн ч git алхмыг нь хийгээгүй тул ажил бүхэлдээ
               алдагдсан. Тиймээс git нь моделийн ажил БИШ болов.)

            ХОРИГ (зөрчвөл PR автоматаар унана — механикаар шалгагдана):
            - Шинэ `!important` нэмэхгүй. Шинэ inline `style=` нэмэхгүй.
            - Хатуу `#hex` өнгө, хатуу `px` бичихгүй — токен л.
            - Тест устгах / алгасах / сулруулахыг ХОРИГЛОНО. Тестийн тоо буурч болохгүй.
            - `.github/workflows/**`, `db/rls.sql`, `db/anon-grants.sql`-д ХҮРЭХГҮЙ.
            - Мөнгө, эрх, өгөгдлийн сангийн ЛОГИКИЙГ ОГТ ХӨНДӨХГҮЙ. Энэ бол
              зөвхөн харагдах байдлын хөрвүүлэлт — үйлдлийн зан чанар БИТГИЙ өөрчил.
            - 500 мөрөөс том diff гаргахгүй. Бүтэн функц хэтэрхий том бол
              түүний ХАМГИЙН ИХ давтагдсан хэсгийг л хий.

            Төгсгөлд нэг догол мөрөөр: ямар функц, хэдэн inline style хөрвүүлсэн,
            юуг зориуд үлдээсэн.

      # ⛔ GIT НЬ МОДЕЛИЙН АЖИЛ БИШ. 2026-09-16-нд агент 63 эргэлт ажиллаж
      # засвараа хийсэн ч салбар/commit/PR алхмыг хийгээгүй тул бүх ажил
      # алдагдсан (0 denial, «амжилттай» гэж дуусаад PR нь алга). Тодорхой
      # дараалалтай, мартагдаж болохгүй ажлыг shell хийнэ — модель зөвхөн
      # файл засна.
      - name: Агентын засварыг commit хийж PR нээх
        id: pr
        if: steps.key.outputs.skip != 'true' && steps.task.outputs.skip != 'true'
        env:
          # ⛔ GITHUB_TOKEN-оор нээсэн PR дээр CI түгжигддэг (толгойг үз).
          GH_TOKEN: ${{ secrets.NIGHT_PAT || secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.task.outputs.target }}
          MODE: ${{ steps.task.outputs.mode }}
          ISSUE: ${{ steps.task.outputs.issue }}
          # Issue-ийн шошго/сэтгэгдэлд — NIGHT_PAT-д Issues эрх байхгүй байж болно.
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ⛔ АЛДАА ЗАСАХ ГОРИМД «засаагүй» нь ЗӨВ ХАРИУ. Гадны код, сүлжээ,
          #    санах ой — эдгээрт манай талд засах зүйл байхгүй. Ийм үед PR
          #    нээхгүй, Issue нь хүнд үлдэнэ (workflow УЛААН болгохгүй).
          if [ -z "$(git status --porcelain)" ]; then
            if [ "$MODE" = "error" ]; then
              echo "::notice::Агент энэ алдааг засах боломжгүй гэж үзэв — #$ISSUE хүнд үлдэв."
              # ⛔ ШОШГО ЗААВАЛ — эс бөгөөс дараагийн шөнө ДАХИН ижил алдааг авч
              #    дахин «боломжгүй» гэж дуусна (09-21…09-24-нд 4 шөнө ингэж
              #    үрэгдсэн). Хүн шошгыг авбал алдаа эргэлтэд буцаж орно.
              # ⚠ GITHUB_TOKEN-оор — NIGHT_PAT-д Issues эрх байхгүй байж болно.
              GH_TOKEN="$ISSUE_TOKEN" gh issue edit "$ISSUE" \
                --add-label "засагдахгүй" >/dev/null 2>&1 || true
              GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body \
                "🌙 Шөнийн агент энэ алдааг засах боломжгүй гэж үзэв — манай талд засах код олдсонгүй (гадны код, сүлжээ, эсвэл өөр репо). Сонголтоос хасав. Дахин оролдуулах бол \`засагдахгүй\` шошгыг ав." >/dev/null 2>&1 || true
              echo "nofix=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Агент ямар ч файл заваагүй. Логоос num_turns ба permission_denials_count-ыг хар."
            exit 1
          fi
          echo '--- Агентын засвар ---'
          git status --short

          # ⛔ АЛДААНЫ ЗАСВАРТ НӨХӨН ҮЗҮҮЛЭХ ТЕСТ ЗААВАЛ. Тестийн тоо өсөөгүй бол
          #    агент алдааг ойлгоогүй эсвэл таамагласан гэсэн үг — PR нээхгүй.
          if [ "$MODE" = "error" ]; then
            BEFORE=$(cat /tmp/tests-before.txt 2>/dev/null || echo 0)
            AFTER=$(node test/run.js 2>/dev/null | grep -o 'нийт [0-9]*' | tail -1 | grep -o '[0-9]*' || echo 0)
            echo "тест: $BEFORE → $AFTER"
            if [ "${AFTER:-0}" -le "${BEFORE:-0}" ]; then
              echo "::error::Нөхөн үзүүлэх тест нэмэгдээгүй ($BEFORE → $AFTER) — PR нээхгүй. #$ISSUE хүнд үлдэв."
              exit 1
            fi
            echo "tests=$BEFORE → $AFTER" >> "$GITHUB_OUTPUT"
          fi

          node tools/debt-check.js --json > /tmp/debt-after.json
          SUMMARY=$(node -e '
            const fs = require("node:fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const b = read("/tmp/debt-before.json");
            const a = read("/tmp/debt-after.json");
            if (!b || !a) { console.log("| — | — | — | тоо уншигдсангүй |"); process.exit(0); }
            const rows = Object.keys(b)
              .filter((k) => a[k] !== b[k])
              .map((k) => `| ${k} | ${b[k]} | ${a[k]} | ${a[k] - b[k] > 0 ? "+" : ""}${a[k] - b[k]} |`);
            console.log(rows.length ? rows.join("\n") : "| — | — | — | өөрчлөлтгүй |");
          ')

          # ⚠ Замын нэр ЗААВАЛ орно — хоёр зам зэрэг явдаг тул нэг минутад
          #   хоёр push хийвэл ижил салбарын нэр дээр мөргөлдөнө.
          BR="claude/night-$MODE-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "chimun-night-agent"
          git config user.email "noreply@anthropic.com"
          git switch -c "$BR"
          git add -A
          if [ "$MODE" = "error" ]; then
            TITLE="Алдаа #$ISSUE зассан (шөнийн агент)"
          else
            TITLE="$TARGET: inline style-ыг класс болгов"
          fi
          git commit -m "$TITLE"
          # ⚠ checkout нь GITHUB_TOKEN-ыг `extraheader`-т хадгалдаг ба тэр нь
          # URL доторх түлхүүрийг ДАРДАГ — 2026-09-17-нд туршихад түлхэлт
          # «Permission denied to github-actions[bot]» (403) болсон. Эхлээд
          # толгойг цэвэрлэж байж л PAT хүчинтэй болно.
          git config --unset-all 'http.https://github.com/.extraheader' || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$BR"

          if [ "$MODE" = "error" ]; then
            BODY=$(printf '%s\n' \
              "Шөнийн агент **Issue #$ISSUE** дээрх алдааг зассан." \
              "" \
              "Тестийн тоо: **$(cat /tmp/tests-before.txt 2>/dev/null || echo '?') → $(node test/run.js 2>/dev/null | grep -o 'нийт [0-9]*' | tail -1 | grep -o '[0-9]*' || echo '?')**" \
              "(нөхөн үзүүлэх тест нэмэгдээгүй бол энэ PR огт нээгдэхгүй)" \
              "" \
              "Closes #$ISSUE" \
              "" \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)")
            PR=$(gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY")
            echo "PR: $PR"
            echo "num=$(basename "$PR")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "Шөнийн агент \`$TARGET\` функцийн inline style-ыг \`styles.css\`-ийн класс болгов." \
            "" \
            "| Метрик | Өмнө | Дараа | Зөрүү |" \
            "|---|---:|---:|---:|" \
            "$SUMMARY" \
            "" \
            "Тоо нь агентын үгээр биш, \`tools/debt-check.js\`-ийн бодит хэмжилтээр." \
            "" \
            "🤖 Generated with [Claude Code](https://claude.com/claude-code)")

          PR=$(gh pr create --base main --head "$BR" \
            --title "$TARGET: inline style-ыг класс болгов" --body "$BODY")
          echo "PR: $PR"
          echo "num=$(basename "$PR")" >> "$GITHUB_OUTPUT"

      - name: Merge-ийн механик шалгуур + merge
        id: merge
        if: steps.key.outputs.skip != 'true' && steps.task.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHT_PAT || secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.task.outputs.mode }}
          WANT_MERGE: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_merge || (github.event_name == 'schedule' && env.AUTO_MERGE == 'true') }}
        run: |
          set -euo pipefail

          # ⚠ PR-ын дугаарыг ХАЙЖ бүү ол — өмнөх алхам нь өөрөө нээсэн тул
          # дугаарыг нь шууд дамжуулна. Хайлт нь өөр агентын PR-ыг андуурч
          # авах эрсдэлтэй (2026-09-04-нд бодит болсон алдаа).
          NUM="${{ steps.pr.outputs.num }}"
          if [ "${{ steps.pr.outputs.nofix }}" = "true" ]; then
            echo "::notice::Засвар хийгдээгүй — merge хийх зүйл алга."
            echo "state=засах боломжгүй гэж үзэв (Issue хүнд үлдэв)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NUM" ]; then
            echo "::error::PR дугаар алга — өмнөх алхам амжилтгүй."
            exit 1
          fi
          echo "PR: #$NUM"

          if [ "$WANT_MERGE" != "true" ]; then
            echo "::notice::AUTO_MERGE унтраалттай — #$NUM хүний шалгалтад үлдэв."
            echo "state=хүний шалгалтад үлдэв (AUTO_MERGE унтраалттай)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BR=$(gh pr view "$NUM" --json headRefName --jq .headRefName)
          git fetch origin "$BR" main --quiet

          # ④-1 diff хэмжээ
          LINES=$(git diff --numstat "origin/main...origin/$BR" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "diff мөр: ${LINES:-0} / $MAX_DIFF_LINES"
          if [ "${LINES:-0}" -gt "$MAX_DIFF_LINES" ]; then
            gh pr comment "$NUM" --body "⚠ diff хэтэрхий том (${LINES} мөр > ${MAX_DIFF_LINES}) — автоматаар merge хийгдээгүй. ХҮН шалгана."
            echo "::warning::diff том — merge хийсэнгүй."
            echo "state=merge хийгдээгүй — diff хэт том (${LINES} мөр)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ④-2 өр ҮНЭХЭЭР буурсан эсэх (зөвхөн тест ногоон байх нь хүрэлцэхгүй —
          #      «ажил хийсэн дүр» үзүүлсэн PR merge хийгдэх ёсгүй).
          # ⚠ АЛДАА ЗАСАХ горимд энэ шалгуур ХАМААРАХГҮЙ — тэнд «ажил хийсэн»
          #   гэдгийн нотолгоо нь ТЕСТИЙН ТОО ӨССӨН эсэх (PR нээх алхамд шалгагдсан).
          if [ "$MODE" != "error" ]; then
          git show "origin/main:tools/debt-baseline.json" > /tmp/base.json
          git show "origin/$BR:tools/debt-baseline.json"  > /tmp/head.json
          IMPROVED=$(node -e '
            const fs = require("node:fs");
            const b = JSON.parse(fs.readFileSync("/tmp/base.json", "utf8"));
            const h = JSON.parse(fs.readFileSync("/tmp/head.json", "utf8"));
            const better = Object.keys(b).filter((k) => (h[k] ?? 0) < b[k]);
            const worse  = Object.keys(b).filter((k) => (h[k] ?? 0) > b[k]);
            console.log(worse.length ? "worse" : better.length ? better.join(",") : "none");
          ')
          echo "өрийн өөрчлөлт: $IMPROVED"
          if [ "$IMPROVED" = "worse" ] || [ "$IMPROVED" = "none" ]; then
            gh pr comment "$NUM" --body "⚠ Дизайны өр буураагүй ($IMPROVED) — автоматаар merge хийгдээгүй. ХҮН шалгана."
            echo "::warning::Өр буураагүй — merge хийсэнгүй."
            echo "state=merge хийгдээгүй — өр буураагүй" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fi

          # ④-3 CI ҮНЭХЭЭР асаасан эсэх. Түгжээтэй шалгалтыг «улаан» гэж
          #      бичвэл өглөө нь буруу дүгнэлт гарна — кодыг буруутгаад
          #      жинхэнэ шалтгаан (түлхүүр алга) нуугдана.
          SHA=$(gh pr view "$NUM" --json headRefOid --jq .headRefOid)
          RUNS=''
          for _ in 1 2 3 4 5 6; do
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
                     --jq '[.check_runs[] | "\(.name):\(.status)/\(.conclusion // "-")"] | join(" ")' 2>/dev/null || true)
            [ -n "$RUNS" ] && break
            sleep 15
          done
          echo "шалгалт: ${RUNS:-алга}"
          if [ -z "$RUNS" ] || printf '%s' "$RUNS" | grep -q 'action_required'; then
            gh pr comment "$NUM" --body "⚠ CI огт ажиллаагүй (шалгалт түгжээтэй) — merge хийгдээгүй. \`NIGHT_PAT\` нууц түлхүүр нэмэгдсэн эсэхийг шалга."
            echo "::warning::CI ажиллаагүй — merge хийсэнгүй."
            echo "state=merge хийгдээгүй — CI огт ажиллаагүй (NIGHT_PAT алга?)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ⑤ CI ногоон болтол хүлээнэ. Улаан бол merge ХИЙХГҮЙ.
          if gh pr checks "$NUM" --watch --fail-fast --interval 15; then
            # ⚠ Хоёр зам зэрэг явдаг тул нэг шөнө хоёр PR `app.js`-ийг хөндөж
            #   МӨРГӨЛДӨЖ болно. Тэр нь эвдрэл БИШ — PR нээлттэй үлдэнэ, өглөө
            #   хүн нэг дарж шийднэ. Улаан болговол жинхэнэ эвдрэл живнэ.
            if gh pr merge "$NUM" --squash --delete-branch; then
              echo "::notice::#$NUM merge хийгдлээ. Буцаах харуул 20 мин тутам хянана."
              echo "state=merge хийгдсэн" >> "$GITHUB_OUTPUT"
            else
              gh pr comment "$NUM" --body "⚠ CI ногоон байсан ч merge хийгдсэнгүй — нөгөө замын PR-тай мөргөлдсөн байж магадгүй. ХҮН шалгана."
              echo "::warning::merge хийгдсэнгүй (мөргөлдөөн?) — #$NUM нээлттэй."
              echo "state=merge хийгдээгүй — мөргөлдсөн байж магадгүй, PR нээлттэй" >> "$GITHUB_OUTPUT"
            fi
          else
            gh pr comment "$NUM" --body "⚠ CI унасан — автоматаар merge хийгдээгүй. ХҮН шалгана."
            echo "::error::CI улаан — merge хийсэнгүй."
            echo "state=merge хийгдээгүй — CI улаан" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ───────── ӨГЛӨӨНИЙ ХУРААНГУЙ ─────────
      # 02:00-д өөрөө merge хийвэл өглөө болоход зөвхөн нэг commit үлдэнэ —
      # хаанаас хармаа мэдэхгүй. Шөнө бүр НЭГ Issue-д сэтгэгдэл нэмнэ: нэг линк
      # нээгээд бүх түүх дараалж харагдана (агент-metrics-тэй ижил хэв маяг).
      # ⚠ `always()` — УНАСАН шөнө ч бичигдэнэ. Зөвхөн амжилтыг бичвэл чимээгүй
      #   бүтэлгүйтэл дахин нуугдана, тэр яг л бидний 4 удаа гишгэсэн тармуур.
      - name: Өглөөний хураангуй бичих
        if: always() && steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.task.outputs.target }}
          NOWORK: ${{ steps.task.outputs.skip }}
          LANE: ${{ matrix.lane }}
          TESTS: ${{ steps.pr.outputs.tests }}
          PR_NUM: ${{ steps.pr.outputs.num }}
          MERGE_STATE: ${{ steps.merge.outputs.state }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh label create "шөнийн-агент" --color 5319e7 \
            --description "Шөнийн агентын түүх (авто)" 2>/dev/null || true

          DAY=$(date -u -d '+8 hours' +%Y-%m-%d)   # УБ цаг
          # Зам бүр өөрийн мөрийг бичнэ (шөнөд 2 мөр). Тэмдэггүй бол өглөө
          # нь аль зам юу хийснийг ялгах аргагүй болно.
          if [ "$LANE" = "error" ]; then ICON='🐞 алдаа'; else ICON='🎨 өр'; fi
          # ⛔ Алдаа алга бол ЮУ Ч БИЧИХГҮЙ — «алдаа байхгүй» гэж шөнө бүр
          #   бичвэл түүх нь хоосон мөрөөр дүүрч, жинхэнэ ажил живнэ.
          #   (Өрийн зам харин бичнэ — хүрээ дуусах нь мэдэх ёстой зүйл.)
          if [ "$NOWORK" = "true" ] && [ "$LANE" = "error" ]; then
            echo "Засах алдаа алга — түүхэнд мөр бичихгүй."
            exit 0
          fi
          if [ "$NOWORK" = "true" ]; then
            LINE="**$DAY** · $ICON · Хүрээнд ажил үлдээгүй — агент ажиллаагүй. \`tools/debt-check.js --suggest\`-ээр шалга."
          elif [ "$JOB_STATUS" != "success" ]; then
            LINE="**$DAY** · $ICON · ❌ Унасан (бай: \`${TARGET:-?}\`). [Лог]($RUN_URL) — \`num_turns\`, \`permission_denials_count\`-ыг хар."
          elif [ "${MERGE_STATE:-}" = "засах боломжгүй гэж үзэв (Issue хүнд үлдэв)" ]; then
            # ⛔ ЗАСААГҮЙГ ✅ ГЭЖ БИЧИХГҮЙ. Өглөөний мэдэгдэл энэ мөрөөс уншдаг тул
            #   «засвар хийгдлээ» гэсэн ХУДАЛ мэдээлэл утсанд очиж байв (2026-09-18).
            LINE="**$DAY** · $ICON · 🔍 \`${TARGET}\` — засах боломжгүй гэж үзэв, \`засагдахгүй\` шошго тавигдав."
          else
            DELTA=$(node -e '
              const fs = require("node:fs");
              try {
                const b = JSON.parse(fs.readFileSync("/tmp/debt-before.json", "utf8"));
                const a = JSON.parse(fs.readFileSync("/tmp/debt-after.json", "utf8"));
                const r = Object.keys(b).filter((k) => a[k] !== b[k])
                  .map((k) => `${k} ${b[k]}→${a[k]}`);
                console.log(r.join(" · ") || "өөрчлөлтгүй");
              } catch { console.log("тоо уншигдсангүй"); }
            ')
            # Зам бүр ӨӨРИЙН нотолгоогоо бичнэ: алдаанд тестийн тоо,
            # өрд хэмжигдэхүүний зөрүү. Нөгөөгийнхийг бичвэл утгагүй
            # («өөрчлөлтгүй» гэж бичигдээд ажил хийгдээгүй мэт харагдана).
            if [ "$LANE" = "error" ]; then DELTA="тест ${TESTS:-?}"; fi
            LINE="**$DAY** · $ICON · ✅ \`${TARGET}\` — $DELTA · PR #${PR_NUM:-?} · ${MERGE_STATE:-төлөв тодорхойгүй}"
          fi
          echo "$LINE"

          NUM=$(gh issue list --label "шөнийн-агент" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$LINE"
          else
            BODY=$(printf '%s\n' \
              "Шөнийн агент шөнө бүр энд нэг мөр бичнэ. Өглөө ЭНЭ ЛИНКИЙГ нээ." \
              "" \
              "Тайлбар: ✅ = ажил хийгдсэн · ❌ = унасан (лог руу ор) ·" \
              "«хүний шалгалтад үлдэв» = PR нээлттэй, чи merge хийнэ." \
              "" \
              "Унтраах: \`agent-night.yml\`-ийн \`AUTO_MERGE\` → \`false\`." \
              "" \
              "$LINE")
            gh issue create --label "шөнийн-агент" \
              --title "🌙 Шөнийн агентын түүх" --body "$BODY"
          fi
