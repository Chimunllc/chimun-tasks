# sw.js-ийн CACHE_VERSION-ыг main дээр АВТОМАТААР бөглөнө.
#
# Яагаад: хувилбарыг гараар засдаг байсан тул зэрэгцээ ажилладаг салбар бүр
# ЯГ ТЭР МӨРИЙГ өөрчилж, merge бүрд конфликт үүсгэдэг байв (2026-09-04-нд нэг
# PR дээр 4 удаа: v829→v835). Одоо салбарууд sw.js-д ХҮРЭХГҮЙ.
#
# Урсгал: PR merge → энэ workflow → хувилбар нэмэгдсэн PR → auto-merge →
#         GitHub Pages дахин байрлуулна → ажилчдын утсанд шинэ код хүрнэ.
#
# ⚠ Яагаад main руу ШУУД push хийдэггүй вэ: branch protection «lint» шалгалтыг
# шаарддаг тул ботын шууд push татгалзана (GH006, 2026-09-04-нд эхний ажиллалт
# яг ингэж унасан — хувилбар нэмэгдээгүй, ажилчдад код хүрээгүй).
#
# ⚠ Яагаад шалгалтыг энд өөрөө ажиллуулдаг вэ: GITHUB_TOKEN-оор нээсэн PR дээр
# workflow АСДАГГҮЙ (GitHub-ийн хязгааргүй давталтаас хамгаалах дүрэм). Тиймээс
# lint.yml энэ PR дээр хэзээ ч ажиллахгүй → шаардлагатай шалгалт хоосон үлдэж
# auto-merge мөнхөд хүлээнэ. Шалгалтыг ҮНЭХЭЭР ажиллуулаад үр дүнг «lint»
# статусаар PR-ын толгойд бичнэ.

name: Кэшийн хувилбар

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.json'
      - 'icon.svg'

# Хоёр merge ойрхон болвол push-ууд мөргөлдөхөөс сэргийлж дараалуулна.
concurrency:
  group: cache-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  bump:
    # Өөрийнхөө commit-оос дахин асахаас сэргийлнэ (хязгааргүй давталт).
    if: "!contains(github.event.head_commit.message, '[cache-bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1-тэй харьцуулна

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Хувилбар нэмэгдүүлэх
        id: bump
        run: |
          set -euo pipefail
          # PR гарчгаас богино шошго гаргана (ж: «Гэрээний байршил…» → merge-нэрээс)
          LABEL=$(echo "${{ github.event.head_commit.message }}" | head -1 \
                  | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-24)
          [ -n "$LABEL" ] || LABEL=auto
          NEW=$(node .github/scripts/bump-cache-version.mjs "$LABEL") || exit 1
          if [ -z "$NEW" ]; then
            echo "Кэшлэгддэг файл өөрчлөгдөөгүй — алгаслаа"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=$NEW" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ⚠ lint.yml-ийн шалгалттай ЯГ ижил байх ёстой — тэрийг өөрчилвөл энийг ч
      # өөрчил. Энд ажиллуулсны дараа л «lint» статус бичигдэнэ (худал батламж
      # өгөхгүй: шалгалт үнэхээр гүйсэн байж л статус гарна).
      - name: Шалгалт (lint.yml-тэй ижил)
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          npx --yes eslint@8 \
            --no-eslintrc \
            --rule '{"no-undef":"error","no-unused-vars":"off","no-redeclare":"warn"}' \
            --env browser --env serviceworker --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            --global ICONS:readonly --global BRANCHES:readonly \
            --global TEAM:writable --global state:writable \
            app.js
          npx --yes eslint@8 \
            --no-eslintrc --rule '{"no-undef":"error"}' \
            --env serviceworker --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            sw.js
          node test/run.js

      - name: PR-аар оруулах
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          BR="cache-bump/${{ github.run_id }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git commit -m "sw: $NEW [cache-bump]"
          git push origin "HEAD:refs/heads/$BR"
          SHA=$(git rev-parse HEAD)

          # Дээрх алхам амжилттай гүйсэн тул статусыг бичиж болно.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=lint \
            -f description='syntax + eslint + тест (cache-bump)' >/dev/null

          PR=$(gh pr create --base main --head "$BR" \
                --title "sw: $NEW [cache-bump]" \
                --body "CACHE_VERSION автоматаар нэмэгдэв. Шалгалт энэ ажиллагаанд гүйсэн: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          # Статус бүртгэгдэхэд хормын зөрүү гардаг — хэдэн удаа оролдоно.
          for i in 1 2 3 4 5; do
            gh pr merge "$PR" --squash --delete-branch && exit 0
            sleep 6
          done
          echo "::error::CACHE_VERSION-ын PR merge хийгдсэнгүй ($PR). Ажилчдын утсанд ШИНЭ КОД ХҮРЭХГҮЙ — PR-ыг гараар merge хийнэ үү."
          exit 1
