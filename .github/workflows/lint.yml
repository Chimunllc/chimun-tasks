name: Lint

# GitHub Actions нь push болгоны дараа автомат ESLint + syntax шалгалт хийнэ.
# Локал суулгац шаардахгүй (CI runner-д ESLint-ийг npx-ээр татаж нэг удаа ажиллуулна).
# saveData()-тэй адил silent JS error буюу undefined function call-ыг барина.

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'sw.js'
      - 'test/**'
      - '.github/workflows/lint.yml'
  # PR бүр merge хийхээс ӨМНӨ шалгагдана. Path шүүлтгүй — PR-ын шалгалт үргэлж
  # ажиллаж байж л «энэ PR шалгагдсан уу?» гэдэгт итгэж болно (2026-09-03).
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # кэшийн хувилбарын шалгалт суурь салбартай харьцуулна

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (app.js)
        run: node --check app.js

      - name: Syntax check (sw.js)
        run: node --check sw.js

      - name: ESLint — no-undef on app.js
        run: |
          npx --yes eslint@8 \
            --no-eslintrc \
            --rule '{"no-undef":"error","no-unused-vars":"off","no-redeclare":"warn"}' \
            --env browser \
            --env serviceworker \
            --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            --global ICONS:readonly \
            --global BRANCHES:readonly \
            --global TEAM:writable \
            --global state:writable \
            app.js

      - name: ESLint — no-undef on sw.js
        run: |
          npx --yes eslint@8 \
            --no-eslintrc \
            --rule '{"no-undef":"error"}' \
            --env serviceworker \
            --env es2022 \
            --parser-options=ecmaVersion:latest,sourceType:script \
            sw.js

      - name: Unit tests (66 цэвэр логик тест)
        run: node test/run.js

      # Кэштэй утсанд өөрчлөлт ХҮРЭХ баталгаа. sw.js-ийн SHELL_FILES-д багтсан файл
      # өөрчлөгдсөн атлаа CACHE_VERSION хэвээр бол service worker хуучин файлаа
      # өгсөөр байх тул merge хийсэн ч ажилчдад «юу ч өөрчлөгдөөгүй» харагдана.
      # 2026-09-04-нд PR #163 яг ингэж алдагдсан тул энэ шалгалт нэмэгдэв.
      - name: Кэшийн хувилбар бөглөгдсөн эсэх
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node .github/scripts/check-cache-version.mjs "${{ github.base_ref }}"
